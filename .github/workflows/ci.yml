name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Show SDK versions
        run: flutter --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test --no-pub --coverage

      - name: Build release web app
        run: flutter build web --release --no-pub

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: gitlore-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        with:
          name: gitlore-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
