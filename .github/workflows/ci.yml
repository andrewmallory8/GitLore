name: GitLore CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Show SDK versions
        run: flutter --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install locked local backend dependencies
        working-directory: backend
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool packages/gitlore_core/lib backend/bin backend/lib backend/test

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test --no-pub --coverage

      - name: Verify shared Dart and Worker fixture
        run: dart --packages=.dart_tool/package_config.json tool/generate_worker_fixture.dart --check

      - name: Analyze and test local Dart backend
        working-directory: backend
        run: |
          dart analyze --fatal-infos
          dart test

      - name: Build release web app
        run: flutter build web --release --no-pub

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: gitlore-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        with:
          name: gitlore-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  worker:
    name: Check, test, and bundle Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting and types
        run: |
          npm run format:check
          npm run check

      - name: Test with fixtures and Workers runtime
        run: |
          npm test
          npm run test:runtime

      - name: Bundle without deploying
        run: npm run build

      - name: Upload Worker bundle
        uses: actions/upload-artifact@v7
        with:
          name: gitlore-worker-${{ github.sha }}
          path: backend/worker/dist/
          if-no-files-found: error
          retention-days: 7
